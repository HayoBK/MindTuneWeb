{{ define "main" }}
<div class="mt-contenedor mt-interior">
  <aside class="mt-indice mt-vidrio">
    {{- if .TableOfContents | findRE "<li" }}
    <div class="mt-etiqueta">En esta página</div>
    {{ .TableOfContents }}
    {{- end }}
  </aside>
  <article class="mt-prosa mt-vidrio mt-vidrio--fuerte">
    <header class="mt-prosa__cabecera">
      {{- with .Params.eyebrow }}<div class="mt-etiqueta">{{ . }}</div>{{ end }}
      <h1>{{ .Title }}</h1>
      {{- with .Params.description }}<p class="mt-prosa__meta">{{ . }}</p>{{ end }}
    </header>
    {{ .Content }}
  </article>
</div>
{{ end }}
