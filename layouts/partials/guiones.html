<script>
(function () {
  // ---------- Menú móvil ----------
  var cab = document.getElementById('cabecera');
  var alternar = cab && cab.querySelector('.mt-nav__alternar');
  if (alternar) {
    alternar.addEventListener('click', function () {
      var abierta = cab.classList.toggle('es-abierta');
      alternar.setAttribute('aria-expanded', abierta ? 'true' : 'false');
      alternar.setAttribute('aria-label', abierta ? 'Cerrar el menú' : 'Abrir el menú');
    });
    cab.querySelectorAll('.mt-nav a').forEach(function (a) {
      a.addEventListener('click', function () { cab.classList.remove('es-abierta'); alternar.setAttribute('aria-expanded', 'false'); });
    });
  }

  var reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Aparecer al entrar en pantalla ----------
  var nodos = document.querySelectorAll('.mt-aparece');
  if (reducido || !('IntersectionObserver' in window)) {
    nodos.forEach(function (n) { n.classList.add('es-visible'); });
  } else {
    var obs = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('es-visible'); obs.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    nodos.forEach(function (n) { obs.observe(n); });
  }

  // ---------- Acceso anticipado: un formulario, dos caminos ----------
  var form = document.getElementById('formulario-anticipado');
  if (!form) return;
  var radios = form.querySelectorAll('input[name="mt_perfil"]');
  var soloClinico = form.querySelectorAll('.mt-solo-clinico');
  var profesion = form.querySelector('#c-profesion');
  var boton = document.getElementById('boton-anticipado');
  var legal = document.getElementById('legal-anticipado');
  var hecho = document.getElementById('anticipado-hecho');
  var hechoTexto = document.getElementById('anticipado-hecho-texto');
  var correo = form.dataset.correo || '';

  var TEXTOS = {
    paciente: {
      boton: 'Avísame cuando pueda probarla',
      legal: 'Usamos tu correo solo para avisarte del piloto de MindTune. Sin publicidad, pocos correos, y puedes pedir que lo borremos cuando quieras.',
      aviso: 'Te escribimos apenas haya cupo en el piloto. No te vamos a llenar la bandeja: solo cuando haya algo que probar.'
    },
    clinico: {
      boton: 'Quiero conocer el lado clínico',
      legal: 'Usamos tus datos solo para contactarte por el piloto de MindTune y coordinar el acceso clínico. Sin publicidad, y puedes pedir que los borremos cuando quieras.',
      aviso: 'Te escribimos cuando abramos el acceso clínico del piloto, para mostrarte cómo se ve el perfil de un paciente y cómo se acompaña desde ahí.'
    }
  };

  function perfilActual() {
    var m = form.querySelector('input[name="mt_perfil"]:checked');
    return m ? m.value : 'paciente';
  }

  function pintar() {
    var perfil = perfilActual();
    var esClinico = perfil === 'clinico';
    soloClinico.forEach(function (c) {
      c.hidden = !esClinico;
      c.querySelectorAll('input, select').forEach(function (campo) { campo.disabled = !esClinico; });
    });
    if (profesion) { profesion.required = esClinico; }
    boton.textContent = TEXTOS[perfil].boton;
    var enlace = legal.querySelector('a');
    legal.textContent = TEXTOS[perfil].legal + ' Detalle en la ';
    if (enlace) { legal.appendChild(enlace); legal.appendChild(document.createTextNode('.')); }
  }

  radios.forEach(function (r) { r.addEventListener('change', pintar); });
  pintar();

  // Los botones con data-perfil eligen el camino antes de bajar a la sección
  document.querySelectorAll('[data-perfil]').forEach(function (b) {
    b.addEventListener('click', function () {
      var destino = form.querySelector('input[name="mt_perfil"][value="' + b.dataset.perfil + '"]');
      if (destino) { destino.checked = true; pintar(); }
    });
  });

  // ---------- El pop-up de aviso ----------
  var aviso = document.getElementById('mt-aviso');
  var avisoCaja = aviso && aviso.querySelector('.mt-aviso__caja');
  var avisoTitulo = document.getElementById('mt-aviso-titulo');
  var avisoTexto = document.getElementById('mt-aviso-texto');
  var avisoAlternativa = document.getElementById('mt-aviso-alternativa');
  var devolverFoco = null;

  function abrirAviso(titulo, texto, mailto) {
    if (!aviso) { return; }
    devolverFoco = document.activeElement;
    avisoTitulo.textContent = titulo;
    avisoTexto.textContent = texto;
    if (mailto) {
      avisoAlternativa.href = mailto;
      avisoAlternativa.hidden = false;
    } else {
      avisoAlternativa.hidden = true;
    }
    aviso.hidden = false;
    document.body.classList.add('es-quieto');
    requestAnimationFrame(function () {
      aviso.classList.add('es-visible');
      avisoCaja.focus();
    });
  }

  function cerrarAviso() {
    if (!aviso || aviso.hidden) { return; }
    aviso.classList.remove('es-visible');
    document.body.classList.remove('es-quieto');
    var esconder = function () { aviso.hidden = true; };
    if (reducido) { esconder(); } else { setTimeout(esconder, 200); }
    if (devolverFoco && devolverFoco.focus) { devolverFoco.focus(); }
  }

  document.querySelectorAll('[data-cerrar-aviso]').forEach(function (b) {
    b.addEventListener('click', cerrarAviso);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { cerrarAviso(); }
  });

  // ---------- Envío ----------
  form.addEventListener('submit', function (ev) {
    if (!window.fetch) { return; }           // sin fetch, que lo mande el navegador
    ev.preventDefault();
    if (form.dataset.enviando === '1') { return; }
    if (!form.reportValidity()) { return; }

    var perfil = perfilActual();
    var textoBoton = boton.textContent;
    form.dataset.enviando = '1';
    boton.disabled = true;
    boton.textContent = 'Enviando…';

    fetch(form.action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
      body: new URLSearchParams(new FormData(form))
    }).then(function (r) {
      return r.json().catch(function () { return { ok: r.ok }; });
    }).then(function (d) {
      if (!d || !d.ok) { throw new Error((d && d.error) || 'respuesta'); }
      form.hidden = true;
      if (hecho) {
        hechoTexto.textContent = TEXTOS[perfil].aviso;
        hecho.hidden = false;
      }
      abrirAviso('Quedaste anotado.', TEXTOS[perfil].aviso, null);
    }).catch(function () {
      abrirAviso(
        'No pudimos registrarte.',
        'Algo falló de nuestro lado y tu correo no quedó guardado. Inténtalo de nuevo en un rato, o escríbenos y te anotamos a mano.',
        'mailto:' + correo + '?subject=' + encodeURIComponent('Acceso anticipado MindTune')
      );
    }).then(function () {
      form.dataset.enviando = '';
      boton.disabled = false;
      boton.textContent = textoBoton;
    });
  });
})();
</script>
