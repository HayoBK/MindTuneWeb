baseURL: "https://mindtune.cl/"
locale: "es-CL"
title: "MindTune"
defaultContentLanguage: "es"
enableRobotsTXT: true
disableKinds: ["taxonomy", "term", "section", "rss"]
timeZone: "America/Santiago"

params:
  description: "App de terapias de sonido personalizadas para tinnitus. Define tu Perfil de Tinnitus, recibe las terapias que le corresponden y aprende a manejarlo. Puedes usarla por tu cuenta o junto a un equipo de salud. En pilotaje: acceso anticipado abierto."
  # Estado que se muestra en el chip de la portada
  estado: "Versión piloto · acceso anticipado"
  correo: "contacto@mindtune.cl"
  # Razón social de la EIRL: NO se muestra en la web por ahora (decisión de Hayo, 2026-09-11). Cuando la entregue, va aquí y en privacidad/términos.
  razon_social: ""
  ciudad: "Santiago de Chile"
  # ---- Fondo de dosel (v2, 2026-09-12) ----
  # Nombre del archivo de video, SIN extensión, dentro de static/video/. Vacío = dosel dibujado en SVG.
  # El video se activa solo si existe static/video/<nombre>.mp4. Ver bin/preparar-video-dosel.sh
  # y GUIA-VIDEO-DE-FONDO.md para conseguirlo y optimizarlo.
  video_fondo: ""
  video_poster: ""
  # Publicación de referencia (D-L8: la eficacia se remite al paper, no se afirma en la web)
  paper:
    cita: "Henríquez P, et al. Brain Sci. 2026;16:644."
    url: "https://doi.org/10.3390/brainsci16060644"
  # Formulario de acceso anticipado (Brevo, D-W3). Dos listas: pacientes y profesionales de salud.
  # Pegar la URL "action" de cada formulario de Brevo (Contactos → Formularios → Compartir → HTML).
  # Ambas vacías = el envío arma un correo a params.correo con lo que la persona escribió.
  brevo:
    action_paciente: "https://c04b295a.sibforms.com/serve/MUIFAP-636T-Z8xyMtsXegWnXmpRgh68PXBQ_K0ZIGRM2NTaXLOeO6pWkXJSs9Dv5ScHTm1Li2pds_lWdC_AGMHtf2cby6gZeHI6Hhcn1KSdxcvoG1SkOi2bswqwAJF7NeKbyiGkJJD_0MX8bUXs8-6T9mkmxFkJkLCdXvC9xq41wy5EbQ5JqEHh0DsEbXKvo2tLOb_x_cCQobnlog=="
    action_clinico: "https://c04b295a.sibforms.com/serve/MUIFAGLVywP2wzqwbvXX6p3gb4rkbqEFdjXXTujS4Ncwa46cdHoQA5Uh9V9zGObVUd3Qg9VBtwmnktj0yGE3eU1ymCLbvrj4aNOj-_kXfW8ajWVNteNQEbKjwmlzMu1IV99Uh3VV317KzmidQlV1Pf0bq3f4Cv8z8eRwRZ15W_RPzfUvAOCtcNO0zuCwBqbnyatjrqgzy1viTR4HCg=="
    # Nombre del campo de correo que espera Brevo (por defecto EMAIL)
    campo_email: "EMAIL"

